[workspace]
resolver = "2"
members = ["crates/cookhla", "crates/cookhla-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/madhavajay/CookHLA-rs"
description = "A Rust port of CookHLA — fast, accurate HLA imputation"

[workspace.dependencies]
cookhla = { path = "crates/cookhla" }
# beagle-rs is wired in at the imputation phase (Phase 7); path dep into the submodule:
#   beagle-rs = { path = "repos/beagle-rs/crates/beagle-rs" }
anyhow = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
