# Two services: the original CookHLA (golden oracle) and the Rust port. Build context is the
# repo root for both so they can see repos/CookHLA (source + vendored binaries + example data).
#
#   docker compose -f docker/compose.yml build
#   docker compose -f docker/compose.yml run --rm oracle     # original CookHLA env
#   docker compose -f docker/compose.yml run --rm cookhla-rs --help
name: cookhla

services:
  oracle:
    image: cookhla-oracle
    build:
      context: ..
      dockerfile: docker/Dockerfile.oracle
    volumes:
      - ../fixtures:/fixtures

  cookhla-rs:
    image: cookhla-rs
    build:
      context: ..
      dockerfile: docker/Dockerfile.cookhla-rs
    volumes:
      - ../fixtures:/fixtures
